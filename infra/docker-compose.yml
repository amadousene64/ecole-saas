# Infra locale de développement. Les mots de passe ci-dessous sont des valeurs de dev ;
# surchargez-les par variables d'environnement ou infra/.env (non versionné ; cp infra/env.example infra/.env).
name: ecole-saas

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      ECOLE_OWNER_PASSWORD: ${ECOLE_OWNER_PASSWORD:-owner-dev}
      ECOLE_APP_PASSWORD: ${ECOLE_APP_PASSWORD:-app-dev}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev}
    ports: ["127.0.0.1:55432:5432"]   # 5432 souvent déjà pris sur le poste
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecole"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8180", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev}
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
    ports: ["127.0.0.1:8180:8180"]
    volumes:
      - ./keycloak/realm-ecole.json:/opt/keycloak/data/import/realm-ecole.json:ro
      # Thème de connexion « ecole » (marque de l'école, deux colonnes), voir realm-ecole.json.
      - ./keycloak/themes/ecole:/opt/keycloak/themes/ecole:ro
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Courrier de développement : Keycloak y envoie les e-mails (vérification d'adresse, mot de passe
  # oublié) ; rien ne part sur Internet. Boîte de réception : http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ecole
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit-dev}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.3
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-dev}"]
    ports: ["127.0.0.1:56379:6379"]   # 6379 souvent déjà pris sur le poste
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis-dev}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev}

  clamav:
    # Antivirus des pièces déposées (dossiers élèves). Démarrage : 1 à 2 minutes.
    # Réglages pour limiter la mémoire en dev (production : à revoir) :
    #  - pas de freshclam : la base de signatures est celle incluse dans l'image (pas de mise à jour
    #    pendant que le conteneur tourne) ;
    #  - pas de rechargement concurrent de la base : sinon clamd garde deux bases en mémoire
    #    (environ 1 Go de plus) le temps d'un rechargement.
    image: clamav/clamav:1.5.4
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  minio:
    # L'éditeur ne publie plus d'images MinIO publiques : dernière image Bitnami figée (dev uniquement).
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ecole
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio-dev-123}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - minio-data:/bitnami/minio/data

volumes:
  postgres-data:
  minio-data:

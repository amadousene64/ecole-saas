# Thème de connexion « ecole » : une page à deux colonnes (marque de l'école | formulaire), avec un
# bandeau sur téléphone. Il remplace « ecole-personnel » pour les trois applications. Basé sur
# keycloak.v2 (champs, boutons, validation, accessibilité) ; seul le gabarit change (template.ftl),
# plus trois pages (login, login-reset-password, info/erreurs héritées) et le style.
parent=keycloak.v2
import=common/keycloak

# Les styles de keycloak.v2 d'abord, les nôtres ensuite (ils les surchargent).
styles=css/styles.css css/ecole.css
scripts=js/marque.js

# Un seul thème clair, comme les applications (pas de mode sombre).
darkMode=false

# Adresse de l'API qui sert la marque publique de l'école (GET /api/v1/public/marque). Réglage du
# poste de développement ; à remplacer à l'installation (voir docs/theme-keycloak.md). L'origine de
# Keycloak doit figurer dans ECOLE_MARQUE_ORIGINES côté API (CORS).
marqueApi=http://localhost:8080

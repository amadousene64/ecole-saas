# Poste local : infra/docker-compose.yml. Ne jamais activer ce profil en production.
spring:
  datasource:
    password: ${ECOLE_DB_APP_PASSWORD:app-dev}
  flyway:
    password: ${ECOLE_DB_OWNER_PASSWORD:owner-dev}
    locations: classpath:db/migration,classpath:db/dev
  data:
    redis:
      password: ${ECOLE_REDIS_PASSWORD:redis-dev}

ecole:
  stockage:
    access-key: ecole
    secret-key: ${ECOLE_MINIO_PASSWORD:minio-dev-123}
    creer-bucket: true
  tenant:
    resolution: entete
  securite:
    jeton:
      # La liste remplace celle par défaut : on y ajoute le client en ligne de commande.
      clients-autorises: [backoffice, parent, vie-scolaire, dev-cli]

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

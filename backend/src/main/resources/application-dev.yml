# Poste local : infra/docker-compose.yml. Ne jamais activer ce profil en production.
spring:
  datasource:
    password: ${ECOLE_DB_APP_PASSWORD:app-dev}
  flyway:
    password: ${ECOLE_DB_OWNER_PASSWORD:owner-dev}
    locations: classpath:db/migration,classpath:db/dev
  data:
    redis:
      password: ${ECOLE_REDIS_PASSWORD:redis-dev}

ecole:
  tenant:
    resolution: entete

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

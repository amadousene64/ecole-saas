# Valeurs par défaut prudentes (production) ; le profil « dev » les assouplit pour le poste local.
server:
  port: 8080
  # Adresse IP réelle du client derrière le répartiteur de charge (limites de débit par IP) : la
  # valve Tomcat ne croit X-Forwarded-For que si la requête vient d'un proxy de confiance
  # (boucle locale par défaut). Derrière un répartiteur, ECOLE_PROXYS_INTERNES donne SON adresse
  # exacte, jamais tout un réseau privé : un conteneur voisin annoncerait l'IP de son choix.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${ECOLE_PROXYS_INTERNES:127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}

spring:
  application:
    name: ecole-backend
  servlet:
    multipart:
      # Plafond global : pièces du dossier (5 Mo, voir ControlePiece). Chaque usage applique ensuite
      # sa propre limite (images officielles et photos : 1 Mo ; import : 2 Mo).
      max-file-size: 5MB
      max-request-size: 6MB
  threads:
    virtual:
      enabled: true
  datasource:
    # L'application se connecte avec ecole_app : non propriétaire des tables => soumise à la RLS.
    # logServerErrorDetail=false : pas de valeurs de lignes (téléphone…) dans les messages d'erreur.
    url: ${ECOLE_DB_URL:jdbc:postgresql://localhost:55432/ecole?currentSchema=ecole&logServerErrorDetail=false}
    username: ${ECOLE_DB_APP_USER:ecole_app}
    password: ${ECOLE_DB_APP_PASSWORD:}
    hikari:
      # Aussi forcé ici : une URL surchargée par l'environnement ne doit pas réactiver les détails.
      data-source-properties:
        logServerErrorDetail: false
  flyway:
    # Les migrations, elles, tournent avec le propriétaire du schéma.
    user: ${ECOLE_DB_OWNER_USER:ecole_owner}
    password: ${ECOLE_DB_OWNER_PASSWORD:}
    default-schema: ecole
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ECOLE_OIDC_ISSUER:http://localhost:8180/realms/ecole}
          audiences: ecole-api
  data:
    redis:
      host: ${ECOLE_REDIS_HOST:localhost}
      port: ${ECOLE_REDIS_PORT:56379}
      password: ${ECOLE_REDIS_PASSWORD:}
      # Court : un appel Redis a lieu pendant que la transaction PostgreSQL est ouverte.
      timeout: 1s

ecole:
  cles:
    # Base64 de 32 octets chacune, DISTINCTES, fournies par l'environnement (jamais dans le dépôt).
    # Générer : openssl rand -base64 32. Absentes : l'application refuse de démarrer.
    chiffrement: ${ECOLE_CLE_CHIFFREMENT:}
    id-chiffrement: ${ECOLE_CLE_CHIFFREMENT_ID:k1}
    hmac-codes: ${ECOLE_CLE_HMAC_CODES:}
  outbox:
    relais:
      actif: true
      delai: 5s
  clamav:
    # clamd (protocole INSTREAM) : analyse des pièces déposées avant mise à disposition.
    hote: ${ECOLE_CLAMAV_HOTE:localhost}
    port: ${ECOLE_CLAMAV_PORT:3310}
    delai: 60s
  tenant:
    resolution: sous-domaine
    domaine-racine: ${ECOLE_DOMAINE_RACINE:monapp.sn}
    # Hôtes communs à toutes les écoles (app parent), séparés par des virgules : l'école y est
    # désignée par X-Tenant-Id. Vide : sous-domaines stricts partout.
    hotes-communs: ${ECOLE_HOTES_COMMUNS:}
  securite:
    cache-roles-ttl: 5m
    jeton:
      # Clients Keycloak (azp) dont les jetons sont acceptés. dev-cli : profil dev uniquement.
      clients-autorises: [backoffice, parent, vie-scolaire]
      # Seuls ces clients activent un code d'école (rattachement parent/élève).
      clients-activation: [parent]

  statistique:
    # Durée de vie du tableau de bord de la direction dans Redis (par école, année, période, cycle).
    cache-ttl: 5m

  stockage:
    # MinIO (API S3). Les clés d'accès viennent de l'environnement ; bucket privé.
    endpoint: ${ECOLE_STOCKAGE_ENDPOINT:http://localhost:9000}
    # Adresse vue par le navigateur pour les URL signées, si elle diffère de l'endpoint.
    endpoint-public: ${ECOLE_STOCKAGE_ENDPOINT_PUBLIC:}
    bucket: ${ECOLE_STOCKAGE_BUCKET:ecole-fichiers}
    access-key: ${ECOLE_STOCKAGE_ACCESS_KEY:}
    secret-key: ${ECOLE_STOCKAGE_SECRET_KEY:}
    creer-bucket: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

spring:
  data:
    redis:
      # Tests : machine chargée par Testcontainers, 1 s est trop court pour un flushAll.
      timeout: 5s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Jamais contacté : les tests fournissent les jetons via spring-security-test.
          issuer-uri: http://localhost:1/realms/test
ecole:
  tenant:
    resolution: entete
  marque:
    origines-autorisees: http://keycloak.test:8180
  outbox:
    relais:
      # Les tests déclenchent le relais eux-mêmes (RelaisOutbox.traiterTout).
      actif: false
springdoc:
  api-docs:
    enabled: true
logging:
  level:
    org.testcontainers: WARN

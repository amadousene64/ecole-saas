<mat-card appearance="outlined">
  <mat-card-header>
    <h1 mat-card-title>{{ textes.choisirEcoleTitre }}</h1>
    <p mat-card-subtitle>{{ textes.choisirEcoleAide }}</p>
  </mat-card-header>
  <mat-card-content>
    <ul class="liste">
      @for (ecole of ecoles(); track ecole.id) {
      <li>
        <button
          matButton="outlined"
          type="button"
          class="ecole"
          (click)="choisie.emit(ecole)"
        >
          {{ ecole.nom }}
        </button>
      </li>
      }
    </ul>
  </mat-card-content>
</mat-card>

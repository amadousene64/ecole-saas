<ecole-modale
  role="alertdialog"
  largeur="etroite"
  [titre]="titre()"
  [(ouverte)]="ouverte"
  [decritPar]="id + '-consequence'"
  focusInitial="[data-confirmation-annuler]"
  [testId]="testId()"
  (fermee)="annulee.emit()"
>
  <div class="ecole-confirmation">
    <svg
      class="ecole-confirmation__icone"
      viewBox="0 -960 960 960"
      width="32"
      height="32"
      aria-hidden="true"
    >
      <!-- Material Symbols « warning » (outlined, 400), Apache 2.0. -->
      <path
        d="m40-120 440-760 440 760H40Zm104-60h672L480-760 144-180Zm361.5-65.68q8.5-8.67 8.5-21.5 0-12.82-8.68-21.32-8.67-8.5-21.5-8.5-12.82 0-21.32 8.68-8.5 8.67-8.5 21.5 0 12.82 8.68 21.32 8.67 8.5 21.5 8.5 12.82 0 21.32-8.68ZM454-348h60v-224h-60v224Zm26-122Z"
      />
    </svg>
    <p class="ecole-confirmation__consequence" [id]="id + '-consequence'">
      {{ consequence() }}
    </p>
  </div>

  @if (erreur(); as message) {
  <p class="message erreur" role="alert" data-testid="erreur-confirmation">
    {{ message }}
  </p>
  } @if (motif() !== 'aucun') {
  <div class="ecole-confirmation__motif">
    <label [for]="id + '-motif'" class="libelle">
      {{ libelleMotif() }} @if (motif() === 'obligatoire') {
      <span>(obligatoire)</span>
      }
    </label>
    <textarea
      [id]="id + '-motif'"
      rows="3"
      maxlength="500"
      [value]="saisie()"
      (input)="saisie.set($any($event.target).value)"
      [attr.aria-required]="motif() === 'obligatoire'"
      [attr.aria-invalid]="tentee() && motifManquant()"
      [attr.aria-describedby]="
          tentee() && motifManquant() ? id + '-motif-erreur' : null
        "
      data-testid="motif-confirmation"
    ></textarea>
    @if (tentee() && motifManquant()) {
    <p
      class="ecole-confirmation__erreur"
      [id]="id + '-motif-erreur'"
      role="alert"
    >
      Indiquez le motif.
    </p>
    }
  </div>
  }

  <div pied>
    <button
      type="button"
      class="bouton secondaire"
      data-confirmation-annuler
      data-testid="annuler-confirmation"
      [disabled]="occupe()"
      (click)="annuler()"
    >
      Annuler
    </button>
    <button
      type="button"
      class="bouton danger"
      data-testid="confirmer-action"
      [disabled]="occupe()"
      [attr.aria-busy]="occupe() || null"
      (click)="confirmer()"
    >
      {{ action() }}
    </button>
  </div>
</ecole-modale>

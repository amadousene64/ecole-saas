name: Dependency-Check

# OWASP dependency-check sur les dépendances Maven : avertissement, jamais bloquant.
# Hebdomadaire et manuel ; sur PR seulement si le secret NVD_API_KEY existe (sans clé, la base
# NVD met un temps considérable à se télécharger).
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths: [backend/pom.xml]

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Clé NVD présente ?
        id: cle
        run: |
          if [ -n "$NVD_API_KEY" ] || [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "actif=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=dependency-check::ignoré sur PR : secret NVD_API_KEY absent"
          fi
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning title=dependency-check::NVD_API_KEY absent : mise à jour de la base NVD très lente"
          fi
      - if: steps.cle.outputs.actif == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.cle.outputs.actif == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - if: steps.cle.outputs.actif == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Analyse
        if: steps.cle.outputs.actif == 'true'
        working-directory: backend
        continue-on-error: true
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:12.1.3:check
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -Dformat=ALL -DfailBuildOnCVSS=11
      - name: Rapport
        if: steps.cle.outputs.actif == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 30

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      # Historique complet : MigrationsImmuablesTest compare les migrations avec origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build et tests (Testcontainers sur le Docker du runner)
        run: ./mvnw -B verify
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-rapports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # PR : seulement les projets touchés par rapport à main.
      - name: Base de comparaison Nx
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main
      - name: Lint, tests et build (projets affectés)
        if: github.event_name == 'pull_request'
        run: npx nx affected -t lint test build
      # Push sur main : tout, pour ne dépendre d'aucun « dernier run réussi ».
      - name: Lint, tests et build (tous les projets)
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t lint test build
      # Le contrat docs/api/openapi.json est contrôlé côté backend (ContratOpenApiTest) ; ici on
      # vérifie que le client versionné en est bien la génération. `add -N` rend visibles les
      # fichiers générés non suivis, que `git diff` ignorerait sinon.
      - name: Dérive du client API
        run: |
          npm run api:generate
          git add -N .
          git diff --exit-code

  securite:
    name: securite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Bloquant : le secret scanning de GitHub n'est pas disponible (dépôt privé, compte gratuit).
      - name: Installer gitleaks (version et empreinte fixées)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks sur tout l'historique
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
      # Avertissement seulement : n'échoue jamais le job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm audit (avertissement)
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning title=npm audit::vulnérabilités de niveau high ou critical détectées (non bloquant)"

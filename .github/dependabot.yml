version: 2
# Règle commune : par écosystème, UN seul groupe pour les mises à jour mineures et correctives
# (une PR par semaine et par écosystème) ; une montée majeure n'entre dans aucun groupe et arrive
# seule, dans sa propre PR, pour être analysée (exemple : POI 6, PR #55).
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday, timezone: Africa/Dakar }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      maven-mineures-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Montées majeures de Spring Boot : décision manuelle.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, timezone: Africa/Dakar }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      # Un seul groupe : les familles qui exigent des versions alignées (Angular, Nx, eslint et
      # typescript-eslint, vitest et @vitest/*) montent ainsi ensemble, sans npm ci cassé.
      npm-mineures-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Les types suivent le Node d'exécution (24, voir les workflows) : pas de majeure de
      # @types/node tant que Node reste en 24 (PR #61 fermée).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Africa/Dakar }
    commit-message: { prefix: "chore(ci)" }
    groups:
      actions-mineures-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Pas de Dockerfile : seules les images de infra/docker-compose.yml sont suivies. Si un
  # Dockerfile apparaît, ajouter aussi l'écosystème « docker ».
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly, day: monday, timezone: Africa/Dakar }
    commit-message: { prefix: "chore(deps)" }
    groups:
      images-mineures-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Le projet est calé sur PostgreSQL 17 (CLAUDE.md).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
